<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Returning to WrightTrack</title><link rel="stylesheet" href="_style.css">
<meta name="robots" content="noindex"></head>
<body>
<h1>Returning to WrightTrack&hellip;</h1>
<p id="msg">One moment: sending QuickBooks' reply back to WrightTrack on your office computer.</p>
<noscript><p>This page needs JavaScript to send you back to WrightTrack.</p></noscript>
<script>
// Intuit requires an https return address for the real books, which WrightTrack (running on a
// PC at the office) does not have. Intuit sends the browser here; this page forwards the browser,
// with Intuit's reply untouched, to the WrightTrack address named in the sign-in ticket. Only
// office-network addresses are accepted, so this page cannot be used to send anyone elsewhere.
(function () {
  var msg = document.getElementById("msg");
  function fail(text) { msg.textContent = text; }
  try {
    var params = new URLSearchParams(window.location.search);
    var state = params.get("state") || "";
    var dot = state.indexOf(".");
    if (dot < 0) return fail("This page only works as the return step of a WrightTrack sign-in. Go back to WrightTrack and click Connect to QuickBooks again.");
    var b64 = state.slice(dot + 1).replace(/-/g, "+").replace(/_/g, "/");
    var origin = atob(b64);
    var u = new URL(origin);
    var host = u.hostname.toLowerCase();
    var local = host === "localhost" || host === "127.0.0.1" || host === "[::1]"
      || /^10\.\d+\.\d+\.\d+$/.test(host) || /^192\.168\.\d+\.\d+$/.test(host) || /^172\.(1[6-9]|2\d|3[01])\.\d+\.\d+$/.test(host)
      || /\.(local|lan|home|internal)$/.test(host) || host.indexOf(".") < 0;
    if ((u.protocol !== "http:" && u.protocol !== "https:") || !local) return fail("WrightTrack's address in this sign-in is not an office-network address, so this page will not forward to it.");
    window.location.replace(u.origin + "/api/qbo/callback" + window.location.search);
  } catch (e) {
    fail("Could not read the sign-in reply. Go back to WrightTrack and click Connect to QuickBooks again.");
  }
})();
</script>
